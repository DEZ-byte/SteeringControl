# One-time setup:
#   pip install pre-commit
#   pre-commit install
# Then every `git commit` runs these. To check the whole tree by hand:
#   pre-commit run --all-files
#
# Hook versions are pinned to commit SHAs, not tags, because a tag can be moved.
# Update deliberately with `pre-commit autoupdate --freeze`.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
