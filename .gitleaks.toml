# gitleaks configuration: every built-in rule, plus rules for the leaks a project
# like this one is most likely to have (a shared Wi-Fi passphrase, a home LAN
# address, a Windows account path, a personal email address).
#
#   gitleaks git -v          scan the full history
#   gitleaks dir -v .        scan the working tree
#
# The pre-commit hook in .pre-commit-config.yaml runs it on every commit.

title = "SteeringControl gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "esp32-ap-passphrase-in-source"
description = "ESP32 access point passphrase written into source. It belongs in the git-ignored bridge-esp32/src/ap_secret.h."
regex = '''(?:OSTEER_AP_PASSWORD|kApPassword\w*)\s*=?\s*"([^"]{8,63})"'''
secretGroup = 1
keywords = ["osteer_ap_password", "kappassword"]
tags = ["wifi", "credential"]

  [[rules.allowlists]]
  description = "The old factory default, public in the README until the per-build passphrase replaced it"
  regexTarget = "secret"
  regexes = ['''^opensteer$''']

[[rules]]
id = "passphrase-in-docs"
description = "A password, passphrase or PSK quoted in prose"
regex = '''(?i)\b(?:password|passphrase|psk)\b[^\n`]{0,12}`([^`\s]{8,63})`'''
secretGroup = 1
keywords = ["password", "passphrase", "psk"]
tags = ["wifi", "credential"]

  [[rules.allowlists]]
  description = "Names, not values, and the old public default"
  regexTarget = "secret"
  regexes = ['''^(?:OSTEER_AP_PASSWORD|opensteer|ap_secret\.h|src/ap_secret\.h)$''']

[[rules]]
id = "windows-home-path"
description = "Absolute Windows home path, which carries the account name"
regex = '''(?i)\b[A-Z]:\\{1,2}Users\\{1,2}([A-Za-z0-9._-]+)'''
secretGroup = 1
keywords = ["users"]
tags = ["pii", "path"]

  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)^(?:Public|Default|All Users|USERNAME|you|yourname)$''']

[[rules]]
id = "posix-home-path"
description = "Absolute macOS or Linux home path, which carries the account name"
regex = '''(?:^|[\s"'(=])/(?:Users|home)/([a-z][a-z0-9._-]+)/'''
secretGroup = 1
keywords = ["/users/", "/home/"]
tags = ["pii", "path"]

  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''^(?:runner|user|you|shared)$''']

[[rules]]
id = "personal-email"
description = "Personal email address. Commits and files use the GitHub noreply address."
regex = '''\b[A-Za-z0-9._%+-]+@(?:gmail|googlemail|yahoo|hotmail|outlook|live|icloud|me|proton|protonmail)\.(?:com|me|ch)\b'''
keywords = ["@"]
tags = ["pii", "email"]

[[rules]]
id = "home-lan-address"
description = "A 192.168.x.x address other than the documented defaults"
regex = '''\b192\.168\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168."]
tags = ["pii", "network"]

  [[rules.allowlists]]
  description = "ESP32 SoftAP gateway and subnet, its client addresses in tests, and the iOS placeholder default"
  regexTarget = "match"
  regexes = ['''^192\.168\.4\.\d{1,3}$''', '''^192\.168\.1\.10$''']

[[allowlists]]
description = "Generated test vectors and the vendored binary"
paths = [
  '''(?:^|/)golden_vectors\.json$''',
  '''^third_party/vigem/ViGEmClient\.dll$''',
  '''^\.gitleaks\.toml$''',
]
