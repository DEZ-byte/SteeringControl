; PlatformIO build for the OpenSteer bridge.
;
; The Arduino CLI is the primary build path. This file exists because PlatformIO
; is the friendlier of the two for anyone who already has it, and because a
; pinned platform makes it reproducible.
;
; Before the first build, copy src/ap_secret.example.h to src/ap_secret.h and set
; the access point passphrase. The build stops until you do.
;
;   pio run                     build the development firmware (default_envs)
;   pio run -e release          build the release firmware, HID only
;   pio run -e dev -t upload    flash the development firmware
;   pio device monitor          open the console, development build only

[platformio]
; The sketch lives at the project root, not in src/, because that is the layout
; the Arduino CLI expects and it must build under both. build_src_filter below is
; what keeps PlatformIO from also compiling the test folder.
src_dir = .
; Without this, a bare `pio run` builds every environment.
default_envs = dev

[env]
; pioarduino rather than the original platformio espressif32 platform: the
; original stalled on Arduino core 2.x, and everything here needs core 3.x on
; ESP-IDF 5.x for the USB HID and the raw lwIP calls.
;
; Pinned to one release, not the moving "stable" tag, so every build fetches the
; same platform and toolchain. 55.03.312-1 is Arduino core 3.3.12 on ESP-IDF
; 5.5.5. Bump it deliberately, together with the core version in README.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter = +<bridge-esp32.ino> +<src/>

; USB_MODE=0 is OTG, which is the mode that can be a HID device. The default on
; many board definitions is 1, the hardware serial bridge, which cannot.
;
; CDC_ON_BOOT stays 0 in both builds. The development console is an explicit
; USBCDC instance created by the sketch, so the two builds differ only in whether
; that instance exists, not in how the platform was configured underneath them.
;
; ARDUINO_RUNNING_CORE and ARDUINO_EVENT_RUNNING_CORE put loop() and the Arduino
; Wi-Fi event task both on core 1, leaving core 0 to the radio and lwIP.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

board_build.partitions = default.csv
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = direct

[env:dev]
; Composite device: HID plus a serial console, product id 0x8100 (a placeholder,
; see config.h). The console is how the fail-safe and free-heap tests are read.
build_flags = -DOSTEER_DEV_CDC=1

[env:release]
; HID only, product id 0x8101 (a placeholder, see config.h). No console, no
; serial port, nothing for an operating system to bind a driver to except the
; game controller.
;
; Re-flashing this build needs the BOOT and RESET buttons, because there is no
; serial interface left for the uploader to reset through.
build_flags = -DOSTEER_DEV_CDC=0
