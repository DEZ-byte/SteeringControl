; OpenSteer preset for Assetto Corsa, Xbox 360 gamepad input.
;
; Built from the game's own X360Default.ini so every section it expects is present
; and in the shape it expects. Only the values below were changed.
;
; Goes in:
;   %USERPROFILE%\Documents\Assetto Corsa\cfg\controllers\presets\
; NOT in savedsets, which the Controls preset list does not read.
;
; Load it from the Controls page, then confirm the four gamepad values on screen.
; The menu is the authority; this file is a starting point.
;
; WHAT CHANGED AND WHY
;
; The gamepad section: the stock values are all things we have to undo. OpenSteer
; shapes the steering once, on the phone, before the packet is built. Every filter
; left on here is a second shaper stacked on the first, and two curves multiplied
; together give a dead centre and twitchy ends.
;
;   STEER_GAMMA        2.0 -> 1.0
;   STEER_FILTER       0.7 -> 0.0   a filter smooths by delaying
;   SPEED_SENSITIVITY  0.2 -> 0.0   moves the lock ratio with speed
;   STEER_SPEED        0.2 -> 0.0   same
;   RUMBLE_INTENSITY   0.8 -> 0.0   the pad is virtual, it has no motors
;   BRAKES GAMMA       2.4 -> 1.0   a steep brake curve on top of a linear pedal
;
; The paddles: the daemon sends upshift as the right bumper and downshift as the
; left. Stock puts gears on A and X and puts two unrelated actions on the bumpers,
; so the gears move and those two actions are freed.
;
; The keyboard shortcuts: these fire whatever the input method is. Stock has ABS on
; A, rewind on D, glance-right on W, slow motion on S and pause-replay on Space,
; which are exactly the keys tools/drive_keys.py steers and brakes with. Left alone,
; steering left toggles ABS and braking triggers slow motion. They are cleared.

[HEADER]
INPUT_METHOD=X360

[ADVANCED]
COMBINE_WITH_KEYBOARD_CONTROL=0

[X360]
STEER_THUMB=LEFT
STEER_GAMMA=1.0    ; linear; the phone already applied a response curve
STEER_FILTER=0.0    ; a filter smooths by delaying, which is added latency
SPEED_SENSITIVITY=0.0    ; changes the lock ratio with speed; unlearnable
STEER_DEADZONE=0.0    ; the phone already trims a deadband
STEER_SPEED=0.0    ; same reason
RUMBLE_INTENSITY=0.0    ; the pad is virtual and has no motors

[KEYBOARD]
MINIMUM_STEERING=0
STEERING_SPEED=1.75
STEERING_OPPOSITE_DIRECTION_SPEED=2.5
STEER_GAIN=0.18
STEER_RESET_SPEED=1.8
LOOKAHEAD_POINTS=6
GAS=0x26 ; Up 
BRAKE=0x28; Down 
RIGHT=0x27; Right
LEFT=0x25; Left
MOUSE_STEER=0
MOUSE_ACCELERATOR_BRAKE=0
MOUSE_SPEED=0.1

[CONTROLLERS]

[STEER]
JOY=-1
AXLE=-1
SCALE=1
LOCK=900
FF_GAIN=1
FILTER_FF=0
STEER_GAMMA=1
STEER_FILTER=0
SPEED_SENSITIVITY=0
DEBOUNCING_MS=50

[FF_TWEAKS]
MIN_FF=0.0
CENTER_BOOST_GAIN=0
CENTER_BOOST_RANGE=0.1

[FF_ENHANCEMENT]
CURBS=1.0
ROAD=0.8
SLIPS=0.2

[THROTTLE]
JOY=-1
AXLE=-1
MIN=-1
MAX=1

[BRAKES]
JOY=-1
AXLE=-1
MIN=-1
MAX=1
GAMMA=1.0    ; stock is 2.4, a steep curve stacked on the phone's own

[HANDBRAKE]
JOY=-1
AXLE=-1
MIN=-1
MAX=1
BUTTON=-1
KEY=-1
XBOXBUTTON=B    ; the daemon sends handbrake as B

[CLUTCH]
