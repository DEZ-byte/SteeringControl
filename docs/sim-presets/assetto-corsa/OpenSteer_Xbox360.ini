; OpenSteer gamepad preset for Assetto Corsa.
;
; Copy to:
;   %USERPROFILE%\Documents\Assetto Corsa\cfg\controllers\savedsets\OpenSteer_Xbox360.ini
; then load it from the preset dropdown in Content Manager, Settings, Controls.
;
; CHECK THE VALUES ON SCREEN AFTER LOADING. Content Manager rewrites this file
; when it saves, and both it and the game have renamed keys across versions. The
; menu is the truth; this file is a starting point. Every setting here is listed
; in docs/sim-presets/assetto-corsa.md with its menu location.
;
; The whole preset says one thing: do nothing to the input. OpenSteer shapes the
; steering once, on the phone, before the packet is built. Anything the game does
; on top of that is a second shaper, and two stacked curves give a dead centre and
; twitchy ends.

[HEADER]
; Mode A presents an Xbox 360 pad through ViGEmBus, so this is the gamepad path,
; not the wheel path. The wheel path expects a device with a real rotation range
; and force feedback motors, and gives a steering axis that behaves nothing like
; the one being sent.
INPUT_METHOD=X360

[X360]
; Linear. Gamma is a response curve and the phone already applied one.
STEER_GAMMA=1.0

; No smoothing. A filter smooths by delaying, which is latency added to a chain
; built to stay under three milliseconds.
STEER_FILTER=0.0

; No deadzone. The phone trims a deadband before the packet is built; a second one
; here subtracts from a range that has already been trimmed, and full lock stops
; being reachable.
STEER_DEADZONE=0.0

; No speed-sensitive steering. It changes the lock ratio with velocity, and you
; cannot build muscle memory against a ratio that moves underneath you.
STEER_SPEED=0.0
SPEED_SENSITIVITY=0.0

; The pad is virtual and has no motors. Haptics come from the phone, driven by the
; daemon reading Assetto Corsa's shared memory.
RUMBLE_INTENSITY=0.0

[STEER]
; Left stick X. Sent as a full 16-bit axis.
JOY=0
AXLE=0
MIN=-1.0
MAX=1.0

[THROTTLE]
; Right trigger.
JOY=0
AXLE=5
MIN=0.0
MAX=1.0

[BRAKE]
; Left trigger.
JOY=0
AXLE=4
MIN=0.0
MAX=1.0

[CLUTCH]
; Deliberately unassigned. The phone has no clutch control and sends zero on that
; axis always, so binding it would give a clutch pedal permanently at rest.
JOY=-1
AXLE=-1

[__EXT_GAMEPAD_BUTTONS]
; Right bumper up, left bumper down, B for the handbrake. Matches the mapping in
; docs/sim-presets/README.md.
GEARUP=5
GEARDN=4
HANDBRAKE=1
